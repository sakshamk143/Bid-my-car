<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bid My Car | Buy & Bid on Used & Damaged Vehicles</title>
  <meta name="description" content="India's trusted platform for Copart-style vehicle auctions. Clean title used cars, bank repossessions, insurance salvage, and government surplus vehicles." />
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#061827',
            deepNavy: '#0B2235',
            cardNavy: '#0E2A42',
            cardHover: '#133552',
            borderSubtle: '#163959',
            electric: {
              DEFAULT: '#087CFF',
              hover: '#006de6',
            },
            sky: {
              DEFAULT: '#39A7FF',
              light: '#5cb8ff',
            },
            lightGray: '#F3F6F9',
            mutedSlate: '#8FA5B8',
            statusRed: '#EF4444',
            statusGreen: '#10B981',
            statusAmber: '#F59E0B',
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#061827] text-[#F3F6F9] min-h-screen flex flex-col antialiased selection:bg-[#087CFF] selection:text-white pb-16 md:pb-0">

  <!-- PREMIUM AUTOMOTIVE DARK AMBIENT BACKGROUND -->
  <div id="ambient-bg-canvas" class="ambient-bg-canvas" aria-hidden="true">
    <!-- Deep Midnight Base Gradient -->
    <div class="ambient-base-gradient"></div>
    <!-- Soft Blurred Atmospheric Light Orbs -->
    <div class="ambient-orb ambient-orb-car-halo"></div>
    <div class="ambient-orb ambient-orb-top-glow"></div>
    <div class="ambient-orb ambient-orb-ambient-glow"></div>
    <!-- Subtle Horizon Line Glow -->
    <div class="ambient-studio-horizon"></div>
    <!-- Floating Subtle Dust Particles -->
    <div class="ambient-dust-container">
      <div class="ambient-dust dust-1"></div>
      <div class="ambient-dust dust-2"></div>
      <div class="ambient-dust dust-3"></div>
      <div class="ambient-dust dust-4"></div>
      <div class="ambient-dust dust-5"></div>
      <div class="ambient-dust dust-6"></div>
      <div class="ambient-dust dust-7"></div>
      <div class="ambient-dust dust-8"></div>
    </div>
    <!-- Fine Film-Grain Texture Overlay -->
    <div class="ambient-grain-overlay"></div>
  </div>

  <!-- FLOATING TOAST NOTIFICATION ENGINE -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- NAVIGATION & TICKER MOUNT -->
  <div id="navbar-container"></div>

  <!-- MAIN APP VIEW CONTAINER (ROUTER CONTROLLED) -->
  <main id="main-container" class="flex-grow min-h-[70vh]">
    <div id="app-view-container" class="page-view-enter"></div>
  </main>

  <!-- FOOTER & PAN-INDIA YARDS DIRECTORY -->
  <div id="footer-container"></div>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <div id="mobile-nav-container"></div>

  <!-- MODAL CONTAINERS -->
  <div id="auth-modal-container"></div>
  <div id="modal-container"></div>
  <div id="seller-wizard-container"></div>
  <div id="logistics-modal-container"></div>
  <div id="inspection-modal-container"></div>
  <div id="deposit-modal-container"></div>

  <!-- BUNDLED APPLICATION SCRIPT (RUNS ON BOTH file:// AND http://) -->
  <script src="js/bundle.js"></script>
</body>
</html>
